[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:mysql]
command=/usr/bin/mysqld_safe
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql.err.log

[program:init-databases]
command=/init-databases.sh
autostart=true
autorestart=false
priority=2
startsecs=0
stdout_logfile=/var/log/supervisor/init-databases.log
stderr_logfile=/var/log/supervisor/init-databases.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:eureka]
# Eureka starts first
command=java -Xmx256m -jar /app/eureka.jar
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/eureka.log
stderr_logfile=/var/log/supervisor/eureka.err.log

[program:user-service]
# Wait for Eureka/MySQL (slightly reduced so auth is ready sooner)
command=bash -c "sleep 15 && java -Xmx256m -jar /app/user.jar"
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/user.log
stderr_logfile=/var/log/supervisor/user.err.log

